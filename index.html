<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art Mockup</title>
  <style>
    :root {
      --page-bg: #080808;
      --desk: #c8a36a;
      --paper: #efe6dc;
      --ink: #1e1d1c;
      --muted: #736b63;
      --tile: #d7c8b5;
      --gold: #e8c85d;
      --gold-deep: #d0ad32;
      --dark: #1b1b1a;
      --screen: #f5f0ea;
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--page-bg);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(92vw, 1400px);
      height: min(90vh, 900px);
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 60px;
      padding-bottom: 50px;
      background: transparent;
    }

    .desk {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 200px;
      background: linear-gradient(180deg, #c59f67 0%, #b98d51 100%);
      border-radius: 35% 35% 0 0 / 100% 100% 0 0;
      box-shadow: inset 0 8px 0 rgba(255,255,255,0.12);
    }

    .laptop {
      position: relative;
      width: 760px;
      height: 490px;
      z-index: 2;
    }

    .laptop-body {
      position: absolute;
      inset: 15px 0 0 0;
      background: linear-gradient(180deg, #1d2022 0%, #0b0d0f 100%);
      border-radius: 18px 18px 16px 16px;
      box-shadow: 0 28px 38px rgba(0,0,0,0.42);
      padding: 18px 18px 20px;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: #f4efe9;
      border-radius: 10px 10px 0 0;
      overflow: hidden;
      border: 2px solid rgba(40,40,40,.15);
    }

    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: rgba(255,255,255,0.18);
      border-bottom: 1px solid rgba(0,0,0,.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      color: #1f1d1b;
    }

    .brand-mark {
      font-size: 11px;
      opacity: 0.7;
      letter-spacing: 0.24em;
    }

    .nav {
      display: flex;
      gap: 18px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #2a2827;
      opacity: 0.7;
    }

    .toolbar-icons {
      display: flex;
      gap: 12px;
      opacity: 0.7;
    }

    .icon {
      width: 10px;
      height: 10px;
      border: 1.5px solid #1d1d1d;
      border-radius: 2px;
      position: relative;
    }

    .icon.search::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 1.5px;
      background: #1d1d1d;
      right: -3px;
      bottom: -2px;
      transform: rotate(45deg);
      border-radius: 2px;
    }

    .icon.bag::before,
    .icon.bag::after {
      content: "";
      position: absolute;
      border: 1.5px solid #1d1d1d;
      border-radius: 2px;
    }

    .icon.bag::before {
      width: 7px;
      height: 6px;
      left: 1px;
      top: 3px;
      border-top: none;
      border-radius: 0 0 3px 3px;
    }

    .icon.bag::after {
      width: 4px;
      height: 4px;
      left: 2px;
      top: -2px;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
    }

    .content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 14px;
      padding: 34px 38px 18px;
      height: calc(100% - 58px);
    }

    .left-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 12px;
    }

    .headline {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 400;
      color: #2b2928;
    }

    .headline strong {
      display: block;
      font-weight: 400;
    }

    .summary {
      margin-top: 20px;
      max-width: 260px;
      font-size: 12px;
      line-height: 1.7;
      color: rgba(30,29,28,0.72);
      font-family: Arial, sans-serif;
    }

    .cta {
      margin-top: 20px;
      width: 120px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #16181a;
      color: #f8f3ee;
      border-radius: 2px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .art-frame {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      background: rgba(255,255,255,0.3);
      border: 1px solid rgba(0,0,0,0.05);
    }

    .art {
      width: 100%;
      height: 190px;
      background: linear-gradient(135deg, #b8b0a4 0%, #d6d0c6 38%, #eae3d9 100%);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
    }

    .art::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(0,0,0,.14) 0%, rgba(0,0,0,.14) 20%, transparent 20%, transparent 100%),
        linear-gradient(90deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,.08) 20%, transparent 20%, transparent 100%);
      opacity: 0.5;
    }

    .art::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0 32%, rgba(0,0,0,0.05) 32% 33%, transparent 33%),
        linear-gradient(180deg, transparent 0 50%, rgba(0,0,0,0.12) 50% 51%, transparent 54%);
      opacity: 0.65;
    }

    .palm {
      position: absolute;
      width: 14px;
      height: 100px;
      background: #d9cab2;
      left: 54%;
      bottom: 16%;
      transform: translateX(-50%);
      border-radius: 20px;
      box-shadow: 0 0 0 3px rgba(31,29,27,0.1);
    }

    .palm::before,
    .palm::after {
      content: "";
      position: absolute;
      width: 62px;
      height: 16px;
      background: #d9cab2;
      border-radius: 50% 0 50% 0;
      top: 18px;
      left: -12px;
      transform: rotate(35deg);
    }

    .palm::after {
      transform: rotate(-35deg);
      left: -12px;
      top: 38px;
    }

    .feature-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 14px;
    }

    .mini-card {
      height: 90px;
      background: linear-gradient(135deg, #d2c4af 0%, #efe7dd 100%);
      border: 1px solid rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
    }

    .mini-card:nth-child(2) {
      background: linear-gradient(135deg, #d4c7b5 0%, #efeee9 100%);
    }

    .mini-card:nth-child(3) {
      background: linear-gradient(135deg, #d9d2c7 0%, #eae1d5 100%);
    }

    .mini-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.04), rgba(0,0,0,0));
    }

    .trackpad {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 230px;
      height: 14px;
      background: rgba(255,255,255,0.06);
      border-radius: 14px 14px 0 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .tablet {
      position: relative;
      width: 350px;
      height: 460px;
      background: linear-gradient(180deg, #1b1d1d 0%, #0d0e0f 100%);
      border-radius: 28px;
      padding: 12px 14px 14px;
      box-shadow: 0 28px 38px rgba(0,0,0,0.38);
      z-index: 2;
    }

    .tablet-inner {
      width: 100%;
      height: 100%;
      background: #efe8df;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(0,0,0,0.06);
    }

    .tablet-topbar {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(255,255,255,0.25);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      font-size: 9px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #1e1d1c;
    }

    .tablet-icons {
      display: flex;
      gap: 10px;
      opacity: 0.75;
    }

    .tablet .icon {
      width: 8px;
      height: 8px;
      border-width: 1.2px;
    }

    .tablet-body {
      padding: 18px 16px 0;
    }

    .tablet-art {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #d6cab8 0%, #efe7dd 100%);
      border: 1px solid rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
    }

    .tablet-art::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.07), rgba(0,0,0,0.01));
    }

    .tablet-art::after {
      content: "";
      position: absolute;
      width: 72%;
      height: 50%;
      bottom: 16%;
      left: 14%;
      background: rgba(0,0,0,0.17);
      filter: blur(22px);
      opacity: 0.25;
    }

    .product {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-name {
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 600;
      color: #1f1d1c;
    }

    .product-meta {
      font-size: 11px;
      color: rgba(31,29,28,0.7);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    .price {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(31,29,28,0.8);
      font-family: Arial, sans-serif;
    }

    .qty {
      background: #1b1b1b;
      color: #f3efe9;
      border-radius: 2px;
      font-size: 9px;
      padding: 8px 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
    }

    .info-row {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      padding-top: 12px;
      border-top: 1px solid rgba(0,0,0,0.08);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(31,29,28,0.78);
      font-family: Arial, sans-serif;
    }

    .symbol-badge {
      position: absolute;
      right: 60px;
      bottom: 42px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 36px rgba(0,0,0,0.18);
      z-index: 1;
    }

    .symbol-badge svg {
      width: 280px;
      height: 280px;
      fill: rgba(255,255,255,0.98);
    }

    @media (max-width: 1100px) {
      .scene {
        transform: scale(0.8);
      }
    }

    @media (max-width: 820px) {
      body {
        overflow: auto;
      }
      .scene {
        width: 100%;
        height: auto;
        flex-direction: column;
        justify-content: center;
        padding: 50px 20px 80px;
        gap: 30px;
        transform: none;
      }
      .desk {
        display: none;
      }
      .laptop {
        width: min(90vw, 700px);
      }
      .tablet {
        width: min(72vw, 340px);
      }
      .symbol-badge {
        position: static;
        margin-top: -20px;
        width: min(64vw, 300px);
        height: min(64vw, 300px);
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="desk"></div>

    <div class="laptop">
      <div class="laptop-body">
        <div class="screen">
          <div class="topbar">
            <div class="brand">
              <span class="brand-mark">NORA ALH ARBI</span>
            </div>
            <div class="nav">
              <span>Home</span>
              <span>Artworks</span>
              <span>About</span>
              <span>Journal</span>
            </div>
            <div class="toolbar-icons">
              <span class="icon search"></span>
              <span class="icon bag"></span>
            </div>
          </div>

          <div class="content">
            <div class="left-copy">
              <h1 class="headline">
                Art<br />
                <strong>inspires</strong>
                a brighter<br />
                tomorrow
              </h1>
              <div class="summary">
                Original artworks inspired by the landscape and architecture of Saudi Arabia.
              </div>
              <a href="#" class="cta">Shop Artworks</a>
            </div>

            <div class="art-frame">
              <div class="art">
                <div class="palm"></div>
              </div>
            </div>
          </div>

          <div class="feature-row">
            <div class="mini-card"></div>
            <div class="mini-card"></div>
            <div class="mini-card"></div>
          </div>
        </div>
      </div>
      <div class="trackpad"></div>
    </div>

    <div class="tablet">
      <div class="tablet-inner">
        <div class="tablet-topbar">
          <span>Nora Alharbi</span>
          <div class="tablet-icons">
            <span class="icon search"></span>
            <span class="icon bag"></span>
          </div>
        </div>

        <div class="tablet-body">
          <div class="tablet-art"></div>
          <div class="product">
            <div class="product-name">Quiet Horizon</div>
            <div class="product-meta">Original Painting</div>
            <div class="price-row">
              <div class="price">SAR 4,800</div>
              <div class="qty">Add To Cart</div>
            </div>
          </div>

          <div class="info-row">
            <span>Details</span>
            <span>+</span>
          </div>
          <div class="info-row">
            <span>Shipping</span>
            <span>+</span>
          </div>
          <div class="info-row">
            <span>Care</span>
            <span>+</span>
          </div>
        </div>
      </div>
    </div>

    <div class="symbol-badge" aria-label="Logo">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M210 52c-18 6-31 19-43 37-17 24-23 50-26 77-5 42 1 85 16 118 6-9 18-21 31-30 29-20 55-34 74-68 15-27 18-64 7-94-7-20-28-35-59-40zm-123 66c18 8 37 20 46 40 11 22 14 45 15 68 1 27-4 53-19 74-18-8-35-17-50-36-17-22-25-48-26-79-2-29 9-53 34-67zm28-27c14 10 25 22 35 38 11 18 15 38 16 57 2 26-5 53-23 78-12 17-26 29-43 40-19-22-23-46-18-77 7-38 19-70 33-96z"/>
      </svg>
    </div>
  </div>
</body>
</html>
